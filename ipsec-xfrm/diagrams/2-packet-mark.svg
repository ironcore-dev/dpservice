<svg xmlns="http://www.w3.org/2000/svg" width="680" height="322" viewBox="0 0 680 322" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img">
<title>Why the packet mark is needed</title>
<desc>Three ESP packets arrive at node A from nodes B, C and D, all with SPI 42 and the same destination, so they collide on the usual lookup key. An nftables PREROUTING rule maps each sender's underlay prefix to a distinct mark, letting the SAD hold three separate SAs with three separate keys.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="322" fill="#FFFFFF"/>
<text x="125" y="50" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">esp arriving at node a</text>
<text x="540" y="50" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">sad entries on node a</text>
<rect x="40" y="72" width="170" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="125" y="90" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">from b, spi 42</text>
<text x="125" y="108" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">src bb::/64</text>
<rect x="40" y="142" width="170" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="125" y="160" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">from c, spi 42</text>
<text x="125" y="178" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">src cc::/64</text>
<rect x="40" y="212" width="170" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="125" y="230" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">from d, spi 42</text>
<text x="125" y="248" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">src dd::/64</text>
<line x1="210" y1="98" x2="241" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="210" y1="168" x2="241" y2="168" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="210" y1="238" x2="241" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="245" y="72" width="160" height="192" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="325" y="160" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">nftables</text>
<text x="325" y="178" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">source /64 to mark</text>
<line x1="407" y1="98" x2="436" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="407" y1="168" x2="436" y2="168" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="407" y1="238" x2="436" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="440" y="72" width="200" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="90" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">mark 0x2</text>
<text x="540" y="108" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">key b to a</text>
<rect x="440" y="142" width="200" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="160" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">mark 0x3</text>
<text x="540" y="178" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">key c to a</text>
<rect x="440" y="212" width="200" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="230" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">mark 0x4</text>
<text x="540" y="248" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">key d to a</text>
<text x="340" y="296" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">without the mark all three share one key of dst plus spi, and only one sa can exist</text>
</svg>
